<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Zero-Agent — From AI Models to Autonomous Software Agents</title>
<desc id="desc">Premium black and chrome Zero-Agent project cover, symbolizing the transition from Earth toward autonomous intelligence and a new world.</desc>
<defs>
<linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#555b61"/><stop offset=".2" stop-color="#fff"/><stop offset=".4" stop-color="#8e949a"/><stop offset=".56" stop-color="#fff"/><stop offset=".78" stop-color="#4d5359"/><stop offset="1" stop-color="#e9ecef"/></linearGradient>
<radialGradient id="planet"><stop offset="0" stop-color="#dfe3e6"/><stop offset=".45" stop-color="#555b61"/><stop offset="1" stop-color="#050608"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".9"/></filter>
</defs>
<rect width="1280" height="640" fill="#000"/>
<circle cx="900" cy="330" r="300" fill="url(#halo)" filter="url(#glow)"/>
<!-- minimal Earth horizon -->
<path d="M720 650 Q900 410 1080 650Z" fill="url(#planet)" opacity=".9"/>
<path d="M720 535 Q900 430 1080 535" fill="none" stroke="url(#chrome)" stroke-width="3" opacity=".8"/>
<!-- orbital silhouette -->
<path d="M900 78 A252 252 0 1 0 900 582" fill="none" stroke="#161a1e" stroke-width="24" stroke-linecap="round"/>
<path d="M900 78 A252 252 0 1 0 900 582" fill="none" stroke="url(#chrome)" stroke-width="13" stroke-linecap="round" filter="url(#shadow)"/>
<!-- ascending spacecraft / intelligence silhouette -->
<path d="M900 88 C884 145 871 224 866 296 C862 355 855 402 829 441 C851 435 879 420 900 392 C921 420 949 435 971 441 C945 402 938 355 934 296 C929 224 916 145 900 88Z" fill="url(#chrome)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
<path d="M900 93V416" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
<circle cx="900" cy="468" r="7" fill="#fff"/>
<!-- wordmark -->
<text x="92" y="270" fill="url(#chrome)" font-family="Montserrat,Arial,sans-serif" font-size="76" font-weight="500" letter-spacing="11">ZERO-AGENT</text>
<line x1="98" y1="306" x2="650" y2="306" stroke="url(#chrome)" stroke-width="2"/>
<text x="98" y="352" fill="#c7cbd0" font-family="Montserrat,Arial,sans-serif" font-size="21" letter-spacing="5">FROM AI MODELS TO AUTONOMOUS</text>
<text x="98" y="388" fill="#c7cbd0" font-family="Montserrat,Arial,sans-serif" font-size="21" letter-spacing="5">SOFTWARE AGENTS</text>
<text x="98" y="472" fill="#858b91" font-family="Montserrat,Arial,sans-serif" font-size="15" letter-spacing="6">BUILDING INTELLIGENCE</text>
<text x="98" y="500" fill="#858b91" font-family="Montserrat,Arial,sans-serif" font-size="15" letter-spacing="6">EXPANDING POSSIBILITIES</text>
</svg>